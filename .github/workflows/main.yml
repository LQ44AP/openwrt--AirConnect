name: Build AirConnect IPK

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.target }} (${{ matrix.arch }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: mipsel_24kc
            sdk_url: https://downloads.openwrt.org/releases/23.05.6/targets/ramips/mt7621/openwrt-sdk-23.05.6-ramips-mt7621_gcc-12.3.0_musl.Linux-x86_64.tar.xz
          
          - arch: mips_24kc
            sdk_url: https://downloads.openwrt.org/releases/23.05.6/targets/ath79/generic/openwrt-sdk-23.05.6-ath79-generic_gcc-12.3.0_musl.Linux-x86_64.tar.xz
            
          - arch: x86_64
            sdk_url: https://downloads.openwrt.org/releases/23.05.6/targets/x86/64/openwrt-sdk-23.05.6-x86-64_gcc-12.3.0_musl.Linux-x86_64.tar.xz

          - arch: aarch64_generic
            sdk_url: https://downloads.openwrt.org/releases/23.05.6/targets/rockchip/armv8/openwrt-sdk-23.05.6-rockchip-armv8_gcc-12.3.0_musl.Linux-x86_64.tar.xz
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
            file wget zstd

      - name: Setup OpenWrt SDK
        run: |
          wget -qO sdk.tar.xz "${{ matrix.sdk_url }}"
          mkdir sdk && tar -xJf sdk.tar.xz -C sdk --strip-components=1
          rm -f sdk.tar.xz

      - name: Setup package feeds & keys
        working-directory: sdk
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # 生成签名密钥，防止缺少密钥导致包无法封包
          make defconfig
          make package/symlinks

      - name: Import AirConnect package
        run: |
          # 将当前仓库内的 Makefile、files 等放入 SDK 的 package 目录
          mkdir -p sdk/package/airconnect
          cp -r Makefile files sdk/package/airconnect/ 2>/dev/null || cp Makefile sdk/package/airconnect/

      - name: Compile AirConnect
        working-directory: sdk
        run: |
          # 选定 airconnect 包
          echo "CONFIG_PACKAGE_airconnect=m" >> .config
          make defconfig
          # 仅编译目标包并输出详细日志
          make package/airconnect/compile V=s -j$(nproc)

      - name: Collect IPK artifacts
        run: |
          mkdir -p output
          find sdk/bin/packages/ -name "*airconnect*.ipk" -exec cp {} output/ \;

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: airconnect-${{ matrix.arch }}
          path: output/*

  release:
    name: Create Release & Upload IPK
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - name: Download all built IPKs
        uses: actions/download-artifact@v4
        with:
          path: ./all-artifacts

      - name: Flatten directory
        run: |
          mkdir -p release-files
          find ./all-artifacts/ -name "*.ipk" -exec cp {} ./release-files/ \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
